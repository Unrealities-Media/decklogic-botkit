# Builds a content-addressed kit release independently of the engine stamp.
#
# Once a day (and on demand) it hashes pinned build inputs and the public SDK.
# If this repository has no release for that kit identity, it builds botkit and the
# simulator library on Linux, Windows and macOS from private DeckLogic, smoke
# tests each build, and publishes engine-plus-kit-digest releases with every
# archive and SHA256SUMS. Only a complete published release skips the build.
#
# Cost: this repository is public, so GitHub's hosted runners are free. It
# never runs on DeckLogic's self-hosted runner, which is registered to DeckLogic
# only (CI-27); a public repository must never schedule on a self-hosted one.
#
# One secret: DECKLOGIC_READ_TOKEN, a fine-grained personal access token with
# Contents: read-only on Unrealities-Media/decklogic and nothing else (the
# organization's policy turns deploy keys off). It is used only to check out
# that repository, and it expires: renew it before the date set on it.
# This workflow never runs on pull requests, so a fork can never read it.
#
# DeckLogic's source is private and this repository's logs are public, so the
# build's output (which would quote source lines in any warning or error) goes
# to a file that is never printed or uploaded. A failed build says only that it
# failed; reproduce it locally with the same DeckLogic commit.
name: Release

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "DeckLogic branch, tag or commit to build"
        default: main
        required: true
      promote_latest:
        description: "Explicitly promote this manual build to Latest (including historical refs)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DECKLOGIC_REF: ${{ inputs.ref || 'main' }}

jobs:
  check:
    name: Kit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Draft listings require push access; this job performs only API reads.
      contents: write
    outputs:
      engine: ${{ steps.identity.outputs.engine }}
      abi: ${{ steps.identity.outputs.abi }}
      sha: ${{ steps.identity.outputs.private_commit }}
      public_sha: ${{ steps.identity.outputs.public_commit }}
      tag: ${{ steps.identity.outputs.tag }}
      digest: ${{ steps.identity.outputs.kit_sha256 }}
      build: ${{ steps.exists.outputs.build }}
      latest: ${{ steps.exists.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: kit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Unrealities-Media/decklogic
          ref: ${{ env.DECKLOGIC_REF }}
          token: ${{ secrets.DECKLOGIC_READ_TOKEN }}
          path: decklogic
          # Identity uses Git trees, not materialized files; only read the stamp.
          sparse-checkout: src-tauri/sim/src/version.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: identity
        run: |
          python3 -B -m unittest discover -s kit/.github -p 'test_release*.py'
          python3 kit/.github/release_identity.py --private decklogic --public kit \
            --out release-identity.json --github-output "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
          PROMOTE_LATEST: ${{ inputs.promote_latest && 'true' || 'false' }}
        run: |
          # Auth/network/API errors stop the job; only a successful list proves absence.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 kit/.github/release_state.py --metadata releases.json --tag "$TAG" \
            --event "$RELEASE_EVENT" --private-ref "$DECKLOGIC_REF" \
            --promote-latest "$PROMOTE_LATEST" --github-output "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc 2.35: the Linux build runs on Ubuntu 22.04 and newer.
          - runner: ubuntu-22.04
            os: linux-x86_64
            lib: libdecklogic_simlib.so
            exe: botkit
          - runner: windows-latest
            os: windows-x86_64
            lib: decklogic_simlib.dll
            exe: botkit.exe
          - runner: macos-latest
            os: macos-arm64
            lib: libdecklogic_simlib.dylib
            exe: botkit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kit
          ref: ${{ needs.check.outputs.public_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Unrealities-Media/decklogic
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.DECKLOGIC_READ_TOKEN }}
          path: decklogic
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-16
        with:
          toolchain: "1.99.1" # = DeckLogic's rust-toolchain.toml
      - name: Build (output kept private)
        shell: bash
        working-directory: decklogic
        run: |
          # Two builds: a --bin filter on one command would skip the library.
          if ! { cargo build --release --locked -p decklogic-botkit --bin botkit \
              && cargo build --release --locked -p decklogic-simlib; } > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "::error::the build failed; its output is not shown because DeckLogic's source is private. Build DeckLogic ${{ needs.check.outputs.sha }} locally."
            exit 1
          fi
          test -f "target/release/${{ matrix.lib }}" || { echo "::error::no ${{ matrix.lib }}"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
          KIT_DIGEST: ${{ needs.check.outputs.digest }}
        run: |
          name="decklogic-botkit-$TAG-${{ matrix.os }}"
          mkdir -p "dist/$name"
          cp "decklogic/target/release/${{ matrix.exe }}" "decklogic/target/release/${{ matrix.lib }}" \
             decklogic/src-tauri/simlib/include/decklogic_simlib.h kit/LICENSE "dist/$name/"
          # Package the exact public snapshot, never private engine source.
          mkdir -p "dist/$name/sdk"
          git -C kit archive "${{ needs.check.outputs.public_sha }}" | tar -x -C "dist/$name/sdk"
          python kit/.github/release_identity.py --private decklogic --public kit --out "dist/$name/release-manifest.json"
          python -c 'import json,os; from pathlib import Path; p=next(Path("dist").glob("*/release-manifest.json")); assert json.loads(p.read_text())["kit_sha256"] == os.environ["KIT_DIGEST"]'
          if [ "$RUNNER_OS" != Windows ]; then
            strip "dist/$name/${{ matrix.exe }}" 2>/dev/null || true
          fi
          dir="$PWD/dist/$name"
          # Python on Windows needs a Windows path to load the DLL.
          if [ "$RUNNER_OS" = Windows ]; then dir=$(cygpath -w "$dir"); fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        shell: bash
        env:
          DIR: ${{ steps.package.outputs.dir }}
          LIB: ${{ matrix.lib }}
          ENGINE: ${{ needs.check.outputs.engine }}
          ABI: ${{ needs.check.outputs.abi }}
          PLATFORM: ${{ matrix.os }}
        run: |
          "$DIR/${{ matrix.exe }}" --help > /dev/null
          python kit/.github/smoke.py
      - name: Archive
        shell: bash
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
          else
            tar --owner=0 --group=0 -czf "$NAME.tar.gz" "$NAME" 2>/dev/null || tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # to collect this run's archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.public_sha }}
          persist-credentials: false
      - name: Collect the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist-in
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ needs.check.outputs.engine }}
          ABI: ${{ needs.check.outputs.abi }}
          SHA: ${{ needs.check.outputs.sha }}
          PUBLIC_SHA: ${{ needs.check.outputs.public_sha }}
          MAKE_LATEST: ${{ needs.check.outputs.latest }}
          TAG: ${{ needs.check.outputs.tag }}
          KIT_DIGEST: ${{ needs.check.outputs.digest }}
        run: |
          mkdir dist && find dist-in -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          test "$(ls dist | wc -l)" -eq 3 || { ls -R dist-in; echo "::error::expected three archives"; exit 1; }
          python3 .github/release_identity.py --collect dist --tag "$TAG" --out dist/release-manifest.json
          python3 -c 'import json,os; m=json.load(open("dist/release-manifest.json")); assert m["kit_sha256"] == os.environ["KIT_DIGEST"]'
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          {
            echo "Built automatically from DeckLogic \`${SHA::12}\` with Rust 1.99.1."
            echo "Public SDK commit: \`$PUBLIC_SHA\`. Kit SHA256: \`$KIT_DIGEST\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Engine | \`$ENGINE\`, ABI $ABI |"
            echo "| Protocol | \`decklogic-bot/1\` |"
            echo "| Library interface | \`decklogic-simlib/1\` |"
            echo "| Platforms | Linux x86_64 (glibc 2.35+), Windows x86_64, macOS arm64 |"
            echo
            echo "Each archive holds the host, library, header, licence, release manifest and matching public SDK/docs in \`sdk/\`."
            echo "Start with [GUIDE.md](https://github.com/$GITHUB_REPOSITORY/blob/$PUBLIC_SHA/GUIDE.md). Scores compare only within one engine version and one pack."
            echo "Archives include only the original synthetic DEMO pack; see [PACKS.md](https://github.com/$GITHUB_REPOSITORY/blob/$PUBLIC_SHA/PACKS.md) for the separate public real-set pack feed."
            echo "Core library functions were checked. Optional capabilities below are measured, not inferred from the engine stamp:"
            python3 -c 'import json; m=json.load(open("dist/release-manifest.json")); [print(a["platform"] + ": " + ", ".join(k + "=" + ("available" if v else "unavailable") for k,v in a["capabilities"]["optional"].items()) + "; demo=" + a["demo"]["status"]) for a in m["artifacts"]]'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$PUBLIC_SHA" \
            --title "decklogic-botkit $TAG" --notes-file notes.md --latest="$MAKE_LATEST"
