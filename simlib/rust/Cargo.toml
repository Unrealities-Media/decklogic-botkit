[package]
name = "decklogic-simlib-client"
version = "0.1.0"
edition = "2021"
description = "A safe Rust wrapper over the DeckLogic simulator shared library (decklogic-simlib/1). Loads the prebuilt library at run time; needs no simulator source."
license = "MIT"

# Not a member of the DeckLogic workspace: it builds on its own, the way an
# outside training loop depends on it. Its only link to the simulator is the
# shared library it loads.
[workspace]

[dependencies]
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
